# 서버 한 대: MySQL 8.4 + 백엔드 + Caddy(HTTPS, 프론트 정적 파일, /api 프록시).
# 값은 같은 디렉터리의 .env(저장소에 넣지 않는다, .env.example 참고). 밖으로 여는 포트는 Caddy 80/443 뿐이다.
name: camgong

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # binlog 를 끈다(010 결정 5-1). 8.4 는 기본으로 켜져 탈퇴 UPDATE 전의 값을 30일 남긴다. 복제·시점 복구는 쓰지 않는다.
    # 이미 binlog 를 켠 채 돌던 볼륨이면 남은 binlog.* 파일은 끈 뒤 자동으로 지워지지 않는다. 끄기 전에 한 번 RESET BINARY LOGS AND GTIDS 를 실행한다.
    command: ["--disable-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: camgong
      # 앱 계정. camgong DB 전체 권한(Flyway 의 CREATE·ALTER, CREATE TEMPORARY TABLES 포함)을 받는다.
      # 세 값은 볼륨을 처음 만들 때만 쓰인다. 그 뒤 .env 를 바꿔도 DB 계정은 그대로다.
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP 로 확인한다: 초기화 중의 임시 서버는 소켓만 열어서, 소켓 ping 은 초기화가 끝나기 전에 성공한다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # 도메인에서 만든다(빠뜨리면 모든 쓰기가 403 이거나 메일 링크가 깨진다). Caddy 가 HTTPS 를 끝내 백엔드는 http 로 받으므로 Origin 허용이 필요하다.
      ALLOWED_ORIGINS: https://${DOMAIN:?}
      VERIFY_LINK_BASE_URL: https://${DOMAIN:?}/verify?token=
      RESET_LINK_BASE_URL: https://${DOMAIN:?}/password-reset/confirm?token=
      # env_file 로 같이 들어오는 DB root 비밀번호는 앱에 주지 않는다.
      MYSQL_ROOT_PASSWORD: ""
      HC_PING_URL: ""          # 백업 알림 주소도 backup.sh 만 쓴다
      # 탈퇴 장부(010 결정 5-2). 컨테이너 안 경로는 고정이고, 호스트 디렉터리(WITHDRAW_LEDGER_DIR)를 바인드 마운트한다.
      # 컨테이너를 다시 만들어도(up -d --build) 남아야 복구 때 되살아난 탈퇴를 다시 익명화할 수 있다.
      WITHDRAW_LEDGER: /var/lib/camgong/ledger/withdraw-ledger.tsv
    volumes:
      # 앱은 uid 10001 로 돈다(backend.Dockerfile). 디렉터리를 먼저 만들고 넘겨준다: mkdir -p <디렉터리> && sudo chown 10001 <디렉터리>
      # 못 쓰면 백엔드가 뜨지 않는다(조용히 장부 없이 돌지 않게).
      - ${WITHDRAW_LEDGER_DIR:?}:/var/lib/camgong/ledger
    # 로그는 복구 근거가 아니다(장부가 맡는다). 가린 수신 주소 같은 줄이 기한 없이 쌓이지 않게 돌린다: 최대 10MB × 3개.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서를 잃으면 재발급 횟수 제한에 걸릴 수 있다. 지우지 않는다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
