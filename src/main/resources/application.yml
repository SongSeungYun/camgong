spring:
  application:
    name: camgong
  datasource:
    # useAffectedRows=true 는 CreateGuard 중복 판정(영향 행 0/1/2)에 필요하다. 지우지 말 것.
    url: ${DB_URL:jdbc:mysql://localhost:3306/camgong?useAffectedRows=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:pw}
    hikari:
      # 락 대기 시간 초과를 짧게(기본 50초는 커넥션을 오래 쥔 채 풀을 말린다). DB_URL 을 바꿔도 적용되도록 URL 이 아니라 여기서 건다.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  mail:
    properties:
      # SMTP 가 멈춰도 메일 스레드가 영원히 묶이지 않게(JavaMail 기본은 무한 대기)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    deserialization:
      # 1.5 같은 소수가 정수 필드에 조용히 잘려 들어가지 않게 한다(수량·가격은 정수만, 계약의 400).
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

camgong:
  auth:
    # 운영 도메인은 환경변수로만 준다. 저장소에 넣지 않는다.
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:school.ac.kr}
    session-ttl: 14d
    session-touch-interval: 10m
    verify-token-ttl: 24h
    mail:
      resend-interval: 1m
      daily-limit: 5
    login:
      max-failures: 5
      lock-duration: 15m
    # 기본은 Secure. 로컬 개발은 local 프로파일(application-local.yml)에서만 끈다 — 운영에서 환경변수를 빠뜨려도 조용히 풀리지 않게.
    cookie-secure: ${COOKIE_SECURE:true}
    bcrypt-cost: 10
    # 프록시 뒤에서 호스트가 달라지면 여기에 프론트 출처를 쉼표로 적는다(Origin 검사 허용 목록).
    allowed-origins: ${ALLOWED_ORIGINS:}
    verify-link-base-url: ${VERIFY_LINK_BASE_URL:http://localhost:5173/verify?token=}
  mail:
    # smtp(기본) | logging(local/test/benchmark 프로파일에서만). SMTP 접속 정보는 SPRING_MAIL_* 환경변수로만 받는다.
    sender: ${MAIL_SENDER:smtp}
  notification:
    async:
      enabled: true         # false 면 알림을 요청 스레드에서 바로 만든다(테스트용). 운영은 true
      core-size: 2
      max-size: 4
      queue-capacity: 1000
    insert-chunk-size: 500
    retry-attempts: 3
    retry-base-delay: 1s    # 재시도 대기는 이 값에서 4배씩 늘린다(1초, 4초, 16초)
    retention: 30d
    cleanup:
      enabled: true
      interval: 1d
  scheduler:
    close:
      enabled: true         # 테스트는 false 로 두고 서비스를 직접 호출한다
      interval: 30s         # 이전 실행이 끝난 뒤 다음 실행까지의 대기(fixedDelay)
      margin: 1s            # 마감 시각 뒤 확정까지의 안전 여유(시계 오차 대비)
      batch-size: 100       # 한 라운드의 후보 조회 개수
      max-rounds: 50        # 한 실행에서 반복하는 최대 라운드 수
